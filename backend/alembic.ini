# =============================================================================
# Alembic Configuration — PrescpHealth Backend
# =============================================================================
# Controls database migration behavior. Uses the SYNC database URL
# (not async) because Alembic's migration runner is synchronous.
#
# The actual connection URL is overridden in env.py from app settings,
# so the value here is just a fallback/placeholder.
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template for new migration filenames
# Format: YYYYMMDD_HHMMSS_description (per database-migration-discipline steering rule)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate long revision IDs in filenames
truncate_slug_length = 60

# Placeholder — overridden by env.py from app.config.Settings
sqlalchemy.url = postgresql://prescphealth:password@localhost:5432/prescphealth

[post_write_hooks]
# Run ruff formatter on new migration files automatically
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
